name: Build GKI Image.gz Only

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Image.gz Only
    runs-on: ubuntu-24.04

    steps:
      # 1. 扩充磁盘并调大 Swap 空间（增加 8GB Swap 专门防止 LTO 链接阶段 OOM）
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. 安装编译依赖与 Repo
      - name: Install Dependencies & Setup Repo
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 build-essential rsync bc libssl-dev
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 3. 配置 Git 标识
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 4. 同步 ACK 6.6 源码
      - name: Sync Kernel Source
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android15-6.6 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      # 5. 编译 Image.gz 并动态定位提取
      - name: Build Only Image.gz
        working-directory: android-kernel
        run: |
          # 限制 Bazel 内存并指定目标
          tools/bazel build \
            --local_ram_resources=HOST_RAM*0.7 \
            //common:kernel_aarch64/Image.gz

          # 创建输出目录，通过 find 容错定位 Image.gz
          mkdir -p dist_out
          find bazel-bin/ -name "Image.gz" -type f -exec cp -L {} dist_out/ \;
          
          # 校验文件是否存在且非空
          test -s dist_out/Image.gz || (echo "Error: Image.gz build failed or empty!" && exit 1)

      # 6. 上传 Image.gz 产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-14943902
          path: android-kernel/dist_out/Image.gz
          if-no-files-found: error

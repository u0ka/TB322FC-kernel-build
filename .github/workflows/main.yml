name: Build alioth DroidSpaces Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            clang \
            lld \
            llvm \
            python3 \
            git \
            ccache

      - name: Download clang
        run: |
          git clone --depth=1 \
          https://github.com/llvm/llvm-project.git \
          -b llvmorg-14.0.6 \
          clang

      - name: Add DroidSpaces config
        run: |
          cat >> arch/arm64/configs/alioth_defconfig <<'EOF'

          # DroidSpaces
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_DEVTMPFS=y

          CONFIG_OVERLAY_FS=y

          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y

          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          EOF

      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
        run: |
          export PATH=$PWD/clang/bin:$PATH

          make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          alioth_defconfig

          make O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: alioth-droidspaces-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/qcom/*.dtb
